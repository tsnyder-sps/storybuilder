<!DOCTYPE html>
<html>
<head>
    <title>FRQ grader</title>
    <style>
        button {background-color:#FF0000;border-radius:10%;color:white;font-family:'Times New Roman'}
        input {background-color:#000000;border-radius:10%;color:white;font-family:'Times New Roman'}
        textarea {background-color:#000000;color:white;font-family:'Times New Roman'}
        label {background-color:#000000;color:white;font-family:'Times New Roman';font-size:1.3vw;}
    </style>
</head>
<body>
        
    <!-- enter question and scoring guidelines-->
    <label id="questionLabel"
    style="position:absolute;top:8vh;left:5vw;width:43vw;height:3vh;">
    Enter the FRQ question here:</label>
    <textarea id="questionInputArea"
    style="resize:none;position:absolute;top:12vh;left:5vw;width:43vw;height:20vh;">
    </textarea>
    <label id="guidelinesLabel"
    style="position:absolute;top:35vh;left:5vw;width:43vw;height:3vh;">
    Enter the FRQ scoring guideline here:</label>
    <textarea id="guidelinesInputArea"
    style="resize:none;position:absolute;top:39vh;left:5vw;width:43vw;height:20vh;">
    </textarea>
    <label id="answerLabel"
    style="position:absolute;top:62vh;left:5vw;width:43vw;height:3vh;">
    Enter the student's answer here:</label>
    <textarea id="answerInputArea"
    style="position:absolute;top:66vh;left:5vw;width:43vw;height:20vh;">
    </textarea>
    <button id="uploadInput"
    style="position:absolute;top:88vh;left:19vw;width:13vw;height:5vh;font-size:20px;">
    Grade answer</button>

    <!-- prompt interaction area-->
    <label id="aiResponseLabel"
    style="position:absolute;top:8vh;left:52vw;width:43vw;height:3vh;">
    The AI will score the student and give feedback about their answer here:</label>
    <textarea id="aiResponseAreaBackground" readonly 
    style="color:black;position:absolute;top:12vh;left:52vw;width:43vw;height:74vh;resize:none;">
    </textarea>
    <div id="aiResponseArea"
    style="color:white;position:absolute;top:13vh;left:52.3vw;width:43vw;height:74vh;word-wrap:break-word;">
    </div>
    <!--scripts-->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        //startup
        //startup defaults
        document.getElementById("questionInputArea").value = "";
        document.getElementById("guidelinesInputArea").value = "";
        document.getElementById("answerInputArea").value = "";
        document.getElementById("aiResponseArea").innerHTML = '';
        //user selection vars
        const aiResponseArea = document.getElementById("aiResponseArea");
        ////////////////////////////////grade quiz
        uploadInput.addEventListener('click', async (event) => {
        event.preventDefault();
        //grab user inputs
        var questionInput = document.getElementById("questionInputArea").value;
	    var guidelinesInput = document.getElementById("guidelinesInputArea").value;
	    var answerInput = document.getElementById("answerInputArea").value;
	    var fullPrompt = "Assume the role of a hardcore high school AP teacher. " 
		+"Score students harshly, that is, if they do not fully satisfy a criteria in the scoring guidelines, do not give them the point. "
		+"State the number of points that the student earned out of the total possible points in the problem. After this, do not restate the total number of possible points. "
		+"Use HTML tags for formatting and not markdown."
        +"Score the following student answer to an AP free response question using the provided scoring guidelines.\n"
		+"Here is the free response question: " + questionInput + "\n"
		+"Here is the student answer to that question: " + answerInput + "\n"
		+"Here are the scoring guidelines for that question: " + guidelinesInput + "\n"
		+"Return the score of the student and an explanation of why the student received that score.";

        
        try {
            aiResponseArea.innerHTML = "Grading FRQ...";
            const response = await fetch('http://localhost:3000/frq/grade', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ prompt: fullPrompt }),
            });


            if (!response.ok) {
            throw new Error(`Server error: ${response.statusText}`);
            }


            const data = await response.json();
            const markdown = data.completion;
            const html = marked.parse(markdown);
            aiResponseArea.innerHTML = html;
            console.log('Server responded', html)
        } catch (error) {
            console.error(error);
            aiResponseArea.innerHTML = 'Error generating text.';
        }


        return false;
        });
        //////////////////////////////////end grade frq
        

    </script>
</body>

</html>

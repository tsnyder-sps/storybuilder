<!DOCTYPE html>
<html>
<head>
    <title>Narrative generator</title>
    <style>
        button {background-color:#FF0000;border-radius:10%;color:white;font-family:'Times New Roman'}
        input {background-color:#000000;border-radius:10%;color:white;font-family:'Times New Roman'}
        textarea {background-color:#000000;color:white;font-family:'Times New Roman'}
        label {background-color:#000000;color:white;font-family:'Times New Roman'}
    </style>
</head>
<body>
    <!--ai response elements from server-->
    <textarea id="aiResponseBackground" readonly
    style="color:white;resize:none;position:absolute;top:5vh;left:55vw;width:40vw;height:80vh;">
    </textarea>
    <div id="aiResponse"
    style="overflow:auto;position:absolute;top:6vh;left:56vw;height:79vh;width:39vw;color:white;">
    </div>
    <button id="selectNarrative" onclick="loadNarrative()"
    style="position:absolute;left:58vw;top:87vh;width:15vw;height:5vh;">
    View narrative</button>
    <button id="selectQuiz" onclick="loadQuiz()"
    style="position:absolute;left:78vw;top:87vh;width:15vw;height:5vh;">
    View quiz</button>
    <!--user inputs-->
    <label id="vocabLabel"
    style="position:absolute;top:5vh;left:5vw;height:5vh;width:40vw;">
    Enter comma seperated target vocab here:</label>
    <textarea id="vocab"
    style="resize:none;position:absolute;top:12vh;left:5vw;height:20vh;width:40vw;">
    </textarea>
    <label id="tenseLabel"
    style="position:absolute;top:35vh;left:5vw;height:5vh;width:40vw;">
    Enter comma seperated target verb conjugations here:</label>
    <textarea id="tense"
    style="resize:none;position:absolute;top:42vh;left:5vw;height:20vh;width:40vw;">
    </textarea>
    <!--user select actions-->
    <button id="generateButton"
    style="position:absolute;top:65vh;left:15vw;height:5vh;width:30vw;">
    Generate narrative</button>
    <select name="language" id="languageSelect"
    style="font-family:Times New Roman;position:absolute;left:6vw;top:65vh;height:5vh;width:8vw;color:white;background-color:black;">
        <option value="french">French</option>
        <option value="spanish">Spanish</option>
        <option value="english">English</option>
    </select>
    <label id="quizLabel"
    style="position:absolute;top:72vh;left:5vw;height:5vh;width:40vw;">
    You can specify a number of questions and have an MCQ quiz generated:</label>
    <!--scripts-->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        //response storage vars
        var narrativeResponse = "";
        var quizResponse = "";
        //startup
        aiResponseBackground.value = "";
        //user selection vars
        const languageSelect = document.getElementById("languageSelect").value;
        const generateButton = document.getElementById('generateButton');
        const vocabInput = document.getElementById('vocab');

        generateButton.addEventListener('click', async (event) => {
        event.preventDefault();
        const vocab = vocabInput.value;
        const tense = document.getElementById("tense").value;

        // Construct the prompt considering language selection and vocab words
        const fullPrompt = `Write me a creative narrative in ${languageSelect} that features the following vocabulary words: ${vocab} and focusing on the following verb tenses: ${tense}`;
        try {
            aiResponse.innerHTML = "Generating story...";
            const response = await fetch('http://localhost:3000/narrative/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ prompt: fullPrompt }),
            });


            if (!response.ok) {
            throw new Error(`Server error: ${response.statusText}`);
            }


            const data = await response.json();
            const markdown = data.completion;
            const html = marked.parse(markdown);
            aiResponse.innerHTML = html;
            narrativeResponse = html; //store narrative
            console.log('Server responded', html)
        } catch (error) {
            console.error(error);
            aiResponse.innerHTML = 'Error generating text.';
        }


        return false;
        });



    </script>
</body>

</html>

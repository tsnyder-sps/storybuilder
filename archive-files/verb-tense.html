<!DOCTYPE html>
<html>
<head>
  <title>Spanish Verb Tenses</title>
  <link rel="stylesheet" href="main_styles.css">
</head>
<body>
  <a href="index.html">Back to Home</a>
  <br>
  <br>
  <h2>Spanish verb tenses and conjugation</h2>
  <label for="prompt">Enter verb (in Spanish) to conjugate:</label><br>
  <textarea id="prompt" rows="2" cols="20"></textarea><br>

  <label for="tense">Choose a tense:</label><br>
  <select id="tense">
    <option value="presente">Presente (Indicative)</option>
    <option value="preteritoImperfecto">Pretérito Imperfecto (Indicative)</option>
    <option value="preteritoIndefinido">Pretérito Indefinido (Indicative)</option>
    <option value="futuroSimple">Futuro Simple (Indicative)</option>
    <option value="condicionalSimple">Condicional Simple (Indicative)</option>
    <option value="preteritoPerfectoCompuesto">Pretérito Perfecto Compuesto (Indicative)</option>
    <option value="preteritoPluscuamperfecto">Pretérito Pluscuamperfecto (Indicative)</option>
    <option value="preteritoAnterior">Pretérito Anterior (Indicative)</option>
    <option value="futuroCompuesto">Futuro Compuesto (Indicative)</option>
    <option value="condicionalCompuesto">Condicional Compuesto (Indicative)</option>
    <option value="presenteSubjuntivo">Presente de Subjuntivo</option>
    <option value="preteritoImperfectoSubjuntivo">Pretérito Imperfecto de Subjuntivo</option>
    <option value="futuroSimpleSubjuntivo">Futuro Simple de Subjuntivo</option>
    <option value="preteritoPerfectoSubjuntivo">Pretérito Perfecto de Subjuntivo</option>
    <option value="preteritoPluscuamperfectoSubjuntivo">Pretérito Pluscuamperfecto de Subjuntivo</option>
    <option value="futuroCompuestoSubjuntivo">Futuro Compuesto de Subjuntivo</option>
    <option value="imperativoAfirmativo">Imperativo Afirmativo</option>
    <option value="imperativoNegativo">Imperativo Negativo</option>
  </select><br>

  <button id="generateButton">Conjugate verb</button>
  <div id="response"></div>

  <script type="text/javascript" src="verb-tense.js"></script>
</body>
</html>

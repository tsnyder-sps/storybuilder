<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHS AI Tools</title>
  <link rel="icon" type="image/png" sizes="16x16" href="img/SPSletterlogo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
  <!-- Header Section -->
  <header role="banner">
    <nav role="navigation">
      <ul>
        <li><a href="index_2.html">HOME</a></li>
        <li><a href="https://chat.scarboroughschools.org/" target="_blank">CHAT</a></li>
      </ul>
    </nav>
    <div class="hero-container">
      <div class="hero">
        <!-- <img src="img/hero-background.jpg" alt="Hero Background Image" aria-label="SHS AI Tools Hero Image"> -->
        <h1>World Language AI Tools</h1>
      </div>
    </div>
  </header>
<!-- Application section -->
  <main role="main">
    <div class="app-section">
      <h1 class="app-section">Story & Quiz Generator</h1>
    </div>
    <div class="grid-item">
        <div class="card">
            <label id="narrativeLabel">Generate a narrative here:</label>
            <br>
            <!--user inputs for narrative-->
            <label for="vocab" id="vocabLabel">Enter comma seperated target vocab here:</label>
            <textarea id="vocab" style="height: 6vh;width: 25vw;resize: none;"></textarea><br>
            <br>
            <label for="tense" id="tenseLabel">Enter comma seperated target verb conjugations here:</label>
            <textarea id="tense" style="height: 6vh;width: 25vw;resize: none;"></textarea><br>
            <br>
            <label id="optionsLabel" for="options">Enter additional instructions here (leave blank if none):</label>
            <textarea id="options" style="height: 6vh;width: 25vw;resize: none;"></textarea><br>
            <br>
            <label id="paragraphLabel" for="paragraphCount">Number of paragraphs:</label>
            <input type="number" id="paragraphCount" min="1" max="1000" style="height: 6vh;"></input><br>
            <br>
            <label id="languageLabel" for="languageSelect">Target language:</label>
            <select name="language" id="languageSelect" style="height: 6vh;">
                <option value="french">French</option>
                <option value="spanish">Spanish</option>
                <option value="english">English</option>
            </select><br>
            <br>
            <!--user select actions-->
            <button id="generateButton">Generate narrative</button>
            <button id="quizGenerateButton">Generate MCQ quiz</button>
        </div>
    </div>
            <!--user inputs for quiz-->
            <label id="quizLabel">
                Generate an MCQ quiz about the narrative:</label>
            <label id="questionsLabel">
                Number of questions:</label>
            <input type="number" id="questionCount" min="1" max="100"></input>
            <label id="questionOptionLabel">
                Number of options per question:</label>
            <input type="number" id="questionOptionCount" min="2" max="6"></input>
        </form>
    </div>
    <div>
        <form>
            <label id="responseLabel">Results will appear here:</label>
            <div id="aiResponseBackground"></div>
            <div id="aiResponse"></div>
            <!--ai response elements from server-->
            <button id="selectNarrative" onclick="loadNarrative()">
                View narrative</button>
            <button id="selectQuiz" onclick="loadQuiz()">
                View quiz</button>
        </form>
    </div>
  </main>
<!-- Footer section -->
  <footer role="contentinfo" id="shshdFooter" class="shshdFooter">
    <div class="shshdBanner">
      <div class="shshdElement shshdLocationElement shshdSingleItem school-details-container shshdThumbnailAlignLeft shshdThumbnailOriginal shshdThumbnailSmall">
        <article class="shshdLocationSingleItem">
          <div class="shshdThumbnail">
            <a class="shshdLocationLink" href="https://www.scarboroughschools.org">
              <img src="img/Help-Desk-Logo-Final.png" alt="SHSHD Logo" loading="lazy" />
            </a>
          </div>
          <div class="shshdLocationInfo">
            <div class="shshdTitle shshdLocationName">
              <a href="https://www.scarboroughschools.org">Scarborough Red Storm Student Help Desk</a>
            </div>
            <div class="shshdAddress shshdAddress-1">11 Municipal Dr</div>
            <div class="shshdCity">Scarborough, </div>
            <div class="shshdState">Maine</div>
            <div class="shshdZip">04074</div>
            </div>
          </div>
        </article>
      </div>
    </div>
  </footer>
  <script type="text/javascript" src="narrative2.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Chatbot</title>
    <link href="rm-styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id="flexContainer">
      <h1>Hello!</h1>
      <div class="wrapper">
        <h2>What can we help you with today? </h2>
        <textarea id="userInput" type="text" placeholder="Ask us for help with homework..."></textarea>
        <div id="buttonHolder">
            <button id="submitter" onclick="sendMessage()" type="submit">Submit</button>
            <button id="clearButton" onclick="clearChat()">Clear Conversation</button>
        </div>
      </div>
      <p id="response"></p>
    </div>
    <script src="stylesHelper.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="chatbot.js"></script>
    
    </body>
</html>

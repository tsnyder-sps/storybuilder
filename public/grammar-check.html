<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHS AI Tools</title>
  <link rel="icon" type="image/png" sizes="16x16" href="img/SPSletterlogo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
  <!-- Header Section -->
  <header role="banner">
    <nav role="navigation">
      <ul>
        <li><a href="index_2.html">HOME</a></li>
        <li><a href="world-language.html">WORLD LANGUAGE</a></li>
        <li><a href="https://chat.scarboroughschools.org/" target="_blank">CHAT</a></li>
      </ul>
    </nav>
    <div class="hero-container">
      <div class="hero">
        <!-- <img src="img/hero-background.jpg" alt="Hero Background Image" aria-label="SHS AI Tools Hero Image"> -->
        <h1>World Language AI Tools</h1>
      </div>
    </div>
  </header>
<!-- Application section -->
  <main role="main" class="full-card-main">
    <div class="main-card-2col">
      <div class="app-section-title">
        <h1 class="app-section">Writing Analysis Tool</h1>
      </div>
      <div class="left-column">
        <div class="student-input-area">
          <div class="sxs">
            <div><label id="narrativeLabel">Enter your text here for analysis:</label></div>
            <div><p>                    </p></div>
            <div><label id="languageLabel" for="language">Language:</label></div>
            <div><select name="language" id="languageSelect">
                <option value="french" selected>French</option>
                <option value="spanish">Spanish</option>
                <option value="english">English</option>
            </select></div>
          </div>
        </div>
        <textarea id="studentInputArea" style="resize: none;width: 40vw;height: 80vh;"></textarea><br>
        <button id="studentInputUpload">Begin analysis of text</button>
      </div>
      <div class="right-column">
        <div class="response-elements">
            <label id="responseLabel">The AI response will appear here (underlining errors):</label>
            <!--ai response elements from server-->
            <div id="aiResponseArea" class="aiResponse scrollable" style="resize: none; width: 40vw;height: 80vh;"></div>
        </div>
      </div>
    </div>
  </main>
<!-- Footer section -->
  <footer role="contentinfo" id="shshdFooter" class="shshdFooter">
    <div class="shshdBanner">
      <div class="shshdElement shshdLocationElement shshdSingleItem school-details-container shshdThumbnailAlignLeft shshdThumbnailOriginal shshdThumbnailSmall">
        <article class="shshdLocationSingleItem">
          <div class="shshdThumbnail">
            <a class="shshdLocationLink" href="https://www.scarboroughschools.org">
              <img src="img/Help-Desk-Logo-Final.png" alt="SHSHD Logo" loading="lazy" style="height: 50px; width: 50px;"/>
            </a>
          </div>
          <div class="shshdLocationInfo">
            <div class="shshdTitle shshdLocationName">
              <a href="https://www.scarboroughschools.org">Scarborough Red Storm Student Help Desk</a>
            </div>
            <div class="shshdAddressBlock">
              <div class="shshdAddress shshdAddress-1">11 Municipal Dr </div>
              <div class="shshdCity">Scarborough, </div>
              <div class="shshdState">ME, </div>
              <div class="shshdZip">04074</div>
            </div>
            </div>
          </div>
        </article>
      </div>
    </div>
  </footer>
  <script type="text/javascript" src="grammar-check.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
</body>
</html>

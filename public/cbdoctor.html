<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHS AI Tools</title>
  <link rel="icon" type="image/png" sizes="16x16" href="img/SPSletterlogo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
  <!-- Header Section -->
  <header role="banner">
    <nav role="navigation">
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="it-utils.html">IT UTILITIES</a></li>
        <li><a href="https://chat.scarboroughschools.org/" target="_blank">CHAT</a></li>
      </ul>
    </nav>
    <div class="hero-container">
      <div class="hero">
        <!-- <img src="img/hero-background.jpg" alt="Hero Background Image" aria-label="SHS AI Tools Hero Image"> -->
        <h1>Chromebook Doctor</h1>
      </div>
    </div>
  </header>

  <!-- Main section-->
   <main role="main">
    <div class="application-section">
      <div class="grid-item">
        <form id="cbdoctorform" enctype="multipart/form-data">
          <label for="asset_tag">Enter the 6 digit asset tag from the sticker on the back of the Chromebook</label>
          <input type="text" name="asset_tag">
          <br><br>
          <label for="image_front">Upload image of the screen and keyboard side of your Chromebook:</label>
          <input type="file" name="image_front" accept=".jpg, .jpeg, .png, .gif">
          <br><br>
          <label for="image_back">Upload image of the back side of your Chromebook:</label>
          <input type="file" name="image_back" accept=".jpg, .jpeg, .png, .gif">
          <br><br>
          <button type="submit">Submit images</button>
        </form>
      </div>
      <div class="grid-item scrollable">
        <div id='airesponse' class="maxcard"></div>
    </div>
  </main>
    <!-- Footer -->
    <footer role="contentinfo" id="shshdFooter" class="shshdFooter">
      <div class="shshdBanner">
        <div class="shshdElement shshdLocationElement shshdSingleItem school-details-container shshdThumbnailAlignLeft shshdThumbnailOriginal shshdThumbnailSmall">
          <article class="shshdLocationSingleItem">
            <div class="shshdThumbnail">
              <a class="shshdLocationLink" href="https://www.scarboroughschools.org">
                <img src="img/Help-Desk-Logo-Final.png" alt="SHSHD Logo" loading="lazy" />
              </a>
            </div>
            <div class="shshdLocationInfo">
              <div class="shshdTitle shshdLocationName">
                <a href="https://www.scarboroughschools.org">Scarborough Red Storm Student Help Desk</a>
              </div>
              <div class="shshdAddress shshdAddress-1">11 Municipal Dr</div>
              <div class="shshdCity">Scarborough, </div>
              <div class="shshdState">Maine</div>
              <div class="shshdZip">04074</div>
              </div>
            </div>
          </article>
        </div>
      </div>
    </footer>
  <script type="text/javascript" src="cbdoctor.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHS AI Tools</title>
  <link rel="icon" type="image/png" sizes="16x16" href="img/SPSletterlogo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
  <!-- Header Section -->
  <header role="banner">
    <nav role="navigation">
      <ul>
        <li><a href="index_2.html">HOME</a></li>
        <li><a href="https://chat.scarboroughschools.org/" target="_blank">CHAT</a></li>
      </ul>
    </nav>
    <div class="hero-container">
      <div class="hero">
        <!-- <img src="img/hero-background.jpg" alt="Hero Background Image" aria-label="SHS AI Tools Hero Image"> -->
        <h1>World Language AI Tools</h1>
      </div>
    </div>
  </header>
<!-- Application section -->
  <main role="main">
    <div class="app-section">
      <h1 class="app-section">Language Learning Story Generator</h1>
    </div>
    <div class="application-section">
      <div class="grid-item">
        <form id="narrativeGenForm">
          <label for="language-select">Choose language:</label>
          <select id="language-select" required>
            <option>Select a language...</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="English">English (ESOL)</option>
          </select>
          <br>
          <br>
          <label for="vocab">Enter vocab words (separated by a comma):</label>
          <textarea id="vocab" rows="4" cols="40"></textarea><br>
          <br>
          <label for="tense">Enter verb tense focus (separated by a comma):</label>
          <textarea id="tense" rows="4" cols="40"></textarea><br>
          <br>
          <button id="generateButton">Generate Narrative</button>
        </form>
      </div>
      <div class="grid-item scrollable">
        <div id='airesponse' class="card"></div>
      </div>
    </div>
  </main>
<!-- Footer section -->
  <footer role="contentinfo" id="shshdFooter" class="shshdFooter">
    <div class="shshdBanner">
      <div class="shshdElement shshdLocationElement shshdSingleItem school-details-container shshdThumbnailAlignLeft shshdThumbnailOriginal shshdThumbnailSmall">
        <article class="shshdLocationSingleItem">
          <div class="shshdThumbnail">
            <a class="shshdLocationLink" href="https://www.scarboroughschools.org">
              <img src="img/Help-Desk-Logo-Final.png" alt="SHSHD Logo" loading="lazy" />
            </a>
          </div>
          <div class="shshdLocationInfo">
            <div class="shshdTitle shshdLocationName">
              <a href="https://www.scarboroughschools.org">Scarborough Red Storm Student Help Desk</a>
            </div>
            <div class="shshdAddress shshdAddress-1">11 Municipal Dr</div>
            <div class="shshdCity">Scarborough, </div>
            <div class="shshdState">Maine</div>
            <div class="shshdZip">04074</div>
            </div>
          </div>
        </article>
      </div>
    </div>
  </footer>
  <script type="text/javascript" src="narrative.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
</body>
</html>
